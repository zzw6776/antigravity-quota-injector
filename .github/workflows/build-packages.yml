name: Build Packages

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_RUNTIME_VERSION: 22.23.1

jobs:
  release-notes:
    name: Validate release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Validate version release notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
          const path = `docs/releases/${version}.md`;
          const notes = readFileSync(path, 'utf8').replace(/\r\n/g, '\n');
          const [title, ...body] = notes.split('\n');
          if (title !== `# ${version}`) throw new Error(`${path}: first line must be # ${version}`);
          if (!body.some(line => /^[-*]\s+\S/.test(line) && /\p{Script=Han}/u.test(line))) {
            throw new Error(`${path}: at least one nonempty Chinese change entry is required`);
          }
          console.log(`Validated ${path}`);
          NODE

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        timeout-minutes: 8
        run: npm test

  macos:
    name: macOS ${{ matrix.architecture }} DMG
    needs: [test, release-notes]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download official Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/node-runtimes
          cd build/node-runtimes
          base="https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}"
          curl -fL --retry 3 -O "${base}/SHASUMS256.txt"
          archive="node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}.tar.gz"
          curl -fL --retry 3 -O "${base}/${archive}"
          grep " ${archive}$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "${archive}"

      - name: Build native injector
        shell: bash
        run: |
          set -euo pipefail
          npm run build:sea -- \
            --node-binary "build/node-runtimes/node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}/bin/node" \
            --output "build/native/Antigravity Quota Injector-${{ matrix.architecture }}"

      - name: Package architecture DMG
        shell: bash
        run: |
          set -euo pipefail
          npm run package:macos -- \
            --architecture "${{ matrix.architecture }}" \
            --input-executable "build/native/Antigravity Quota Injector-${{ matrix.architecture }}" \
            --node-license "build/node-runtimes/node-v${NODE_RUNTIME_VERSION}-darwin-${{ matrix.architecture }}/LICENSE" \
            --output-dir "release/macos-${{ matrix.architecture }}"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-quota-injector-macos-${{ matrix.architecture }}
          retention-days: 30
          if-no-files-found: error
          path: release/macos-${{ matrix.architecture }}/*.dmg

  windows:
    name: Windows x64 Setup
    needs: [test, release-notes]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download official Node.js runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION"
          $archive = "node-v$env:NODE_RUNTIME_VERSION-win-x64.zip"
          New-Item -ItemType Directory -Force -Path "build/node-runtimes" | Out-Null
          Invoke-WebRequest "$base/SHASUMS256.txt" -OutFile "build/node-runtimes/SHASUMS256.txt"
          Invoke-WebRequest "$base/$archive" -OutFile "build/node-runtimes/$archive"
          $line = Select-String -Path "build/node-runtimes/SHASUMS256.txt" -Pattern " $archive$" | Select-Object -First 1
          if (-not $line) { throw "Node.js checksum not found" }
          $expected = ($line.Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash "build/node-runtimes/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node.js checksum mismatch" }
          Expand-Archive "build/node-runtimes/$archive" -DestinationPath "build/node-runtimes" -Force

      - name: Build Windows SEA executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build:sea -- `
            --node-binary "build/node-runtimes/node-v$env:NODE_RUNTIME_VERSION-win-x64/node.exe" `
            --output "build/native/Antigravity Quota Injector.exe"

      - name: Stage Node.js license
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -LiteralPath "build/node-runtimes/node-v$env:NODE_RUNTIME_VERSION-win-x64/LICENSE" `
            -Destination "build/native/NODE_LICENSE.txt"

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makensisPath = $null
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $candidatePaths = @(
            (Join-Path $programFilesX86 "NSIS\makensis.exe"),
            (Join-Path $env:ProgramFiles "NSIS\makensis.exe")
          )
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress
            $chocoExitCode = $LASTEXITCODE
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($chocoExitCode -eq 0 -and $command) {
              $makensisPath = $command.Source
              break
            }
            $makensisPath = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($makensisPath) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 10) }
          }
          if (-not $makensisPath) { throw "NSIS 安装失败或找不到 makensis.exe" }
          Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS_PATH=$makensisPath"

      - name: Package Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run package:windows -- `
            --input-executable "build/native/Antigravity Quota Injector.exe" `
            --node-license "build/native/NODE_LICENSE.txt" `
            --output-dir "release/windows" `
            --makensis "$env:MAKENSIS_PATH"

      - name: Smoke test Windows install and shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (& node -p "require('./package.json').version").Trim()
          $setup = (Resolve-Path "release/windows/Antigravity-Quota-Injector-$packageVersion-windows-x64-Setup.exe").Path
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Antigravity Quota Injector"
          $install = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows Setup exited with $($install.ExitCode)" }

          $main = Join-Path $installRoot "Antigravity Quota Injector.exe"
          $desktopLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Antigravity Quota Injector.lnk"
          $startMenuLnk = Join-Path ([Environment]::GetFolderPath('Programs')) "Antigravity Quota Injector\Antigravity Quota Injector.lnk"
          $startupLnk = Join-Path ([Environment]::GetFolderPath('Startup')) "Antigravity Quota Injector.lnk"
          foreach ($p in @($main, $desktopLnk, $startMenuLnk)) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing installed artifact: $p" }
          }
          if (Test-Path -LiteralPath $startupLnk) { throw "Unexpected auto-start shortcut in Startup folder" }

          $verFile = Join-Path $env:RUNNER_TEMP "aq-version.txt"
          $verProc = Start-Process -FilePath $main -ArgumentList "--version" -Wait -PassThru -RedirectStandardOutput $verFile
          if ($verProc.ExitCode -ne 0) { throw "--version exited with $($verProc.ExitCode)" }
          $verOut = (Get-Content -LiteralPath $verFile -Raw).Trim()
          if ($verOut -ne $packageVersion) { throw "Expected --version '$packageVersion', got '$verOut'" }

          $prep = Start-Process -FilePath $main -ArgumentList "--prepare-update" -Wait -PassThru
          if ($prep.ExitCode -ne 0) { throw "--prepare-update exited with $($prep.ExitCode)" }

          $reinstall = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Same-version reinstall exited with $($reinstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $main -PathType Leaf)) { throw "Same-version reinstall removed executable" }

          $uninstaller = Join-Path $installRoot "Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Windows uninstall exited with $($uninstall.ExitCode)" }
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Test-Path -LiteralPath $main) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path -LiteralPath $main) { throw "Windows uninstall left executable behind" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-quota-injector-windows
          retention-days: 30
          if-no-files-found: error
          path: release/windows/*.exe

  release:
    name: Publish release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: antigravity-quota-injector-*
          path: release-assets
          merge-multiple: true

      - name: Create update manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-update-manifest.mjs \
            --assets release-assets \
            --output release-assets/update.json \
            --repository "${GITHUB_REPOSITORY}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"
          release_title="Antigravity Quota Injector ${package_version}"
          notes_file="docs/releases/${package_version}.md"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "Release tag must match package.json: ${release_tag}" >&2
            exit 1
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${release_tag}" \
              --draft=false \
              --latest \
              --notes-file "${notes_file}" \
              --title "${release_title}" \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${release_tag}" \
              --draft \
              --notes-file "${notes_file}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --repo "${GITHUB_REPOSITORY}"
            gh release upload "${release_tag}" release-assets/* --repo "${GITHUB_REPOSITORY}"
            gh release edit "${release_tag}" \
              --draft=false \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          fi
